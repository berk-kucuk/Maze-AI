[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maze-ai"
version = "1.11.2"
description = "Agentic AI assistant for Maze Linux — local models via Ollama, native tool calling, monochrome UI."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Berk Küçük", email = "dev.berkkucukk@gmail.com" }]
dependencies = [
    "PySide6>=6.6",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
maze-ai = "maze_ai.app:main"

[tool.setuptools]
packages = [
    "maze_ai",
    "maze_ai.llm",
    "maze_ai.agent",
    "maze_ai.ui",
    "maze_ai.resources",
]

[tool.setuptools.package-data]
"maze_ai.resources" = ["*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Correctness and hygiene, not formatting opinions: E501 (line length) is left
# to human judgement so wrapped prompt text isn't mangled.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests import Qt after an importorskip guard, on purpose.
"tests/*" = ["E402"]
